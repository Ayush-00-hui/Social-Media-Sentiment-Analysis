version: "3.8"

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: sentiment_postgres
    environment:
      POSTGRES_DB: sentiment_db
      POSTGRES_USER: ayush_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayush_admin -d sentiment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi-sentiment-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fastapi_sentiment_engine
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://ayush_admin:secret_pass@postgres-db:5432/sentiment_db}
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN:-test_bearer_token}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always

  n8n-automation:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n_automation
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-n8n_pass}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  n8n_data:
